name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m skin_lesion_ml evaluate --data data/demo_features.csv --models logreg hierarchical --selection f --folds 3 --inner-folds 2 --k 10
